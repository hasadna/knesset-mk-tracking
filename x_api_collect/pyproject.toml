[project]
name = "x-api-collect"
version = "0.1.0"
description = "X (Twitter) API collection module for MK tracking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-bigquery>=3.42.2",
    "httpx>=0.27.0",
]

[project.scripts]
x-api-collect = "cli:run_cli"

[tool.setuptools]
py-modules = ["cli", "x_client"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
