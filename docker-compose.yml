# Local PostgreSQL for development.
#
#   docker compose up -d
#   export DATABASE_URL=postgresql://mk:mk@127.0.0.1:5432/mk_tracking
#   uv run python db/bootstrap.py --sqlite mk_tracking.db
#   MK_WORK_DATA_BACKEND=postgres uv run mkwork --port 1234
#
# bootstrap.py applies db/schema.sql, loads the export, ingests the over.org.il
# vote record and then verifies the row counts. No psql required. It reads
# DATABASE_URL, or the PG* variables — see src/mk_tracking/db_config.py — so the same command
# builds a hosted database.
#
# No Docker? Any PostgreSQL 16 works — `brew install postgresql@16` on macOS.
# The application only needs DATABASE_URL; it does not care how you got one.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mk
      POSTGRES_PASSWORD: mk
      POSTGRES_DB: mk_tracking
    # Loopback only. This holds the real dataset behind a throwaway password,
    # so publishing it on every interface would expose it to the whole network.
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mk -d mk_tracking"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
