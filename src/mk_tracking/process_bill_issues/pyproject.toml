[project]
name = "bill-issues"
version = "0.1.0"
description = "Populate bill_issue mapping using Gemini"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-bigquery>=3.42.2",
    "google-genai>=0.2.0",
    "pydantic>=2.9.0",
    "google-cloud-storage>=2.14.0",
    "pymupdf>=1.23.0",
    "python-docx>=1.1.0",
    "tqdm>=4.66.0"
]

[project.scripts]
bill-issues = "cli:main"

[tool.setuptools]
py-modules = ["cli"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
